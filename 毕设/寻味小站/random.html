<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随机选菜 - 寻味小站</title>
  <meta name="description" content="不知道吃什么？限定口味范围，随机抽一道美食，解决选择困难。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍜</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部导航 -->
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><span class="logo-icon">🍜</span>寻味小站<small>美食智能推荐系统</small></a>
      <nav class="nav">
        <a class="nav-link" href="index.html">首页</a>
        <a class="nav-link" href="list.html">全部菜品</a>
        <a class="nav-link active" href="random.html">随机选菜</a>
        <a class="nav-link" href="assistant.html">AI 助手</a>
        <a class="nav-link" href="forum.html">互动社区</a>
        <a class="nav-link" href="user.html">个人中心</a>
      </nav>
      <div id="navUser"></div>
    </div>
  </header>

  <!-- 随机选菜：抽签决定今天吃什么 -->
  <main class="container">
    <div class="random-wrap">
      <h1 class="random-title">🎲 今天吃什么？让命运决定！</h1>
      <p class="random-sub">专治"选择困难症"，点一下按钮，小站帮你随机抽一道菜</p>

      <!-- 可选：限定口味范围再抽 -->
      <div class="random-tag-filter" id="randomTags"></div>

      <!-- 抽签结果卡片 -->
      <div class="random-card" id="randomCard">
        <img class="random-img" id="randomImg" src="images/placeholder.svg" alt="随机菜品" onerror="this.onerror=null;this.src='images/placeholder.svg'">
        <div class="random-body">
          <div class="random-name" id="randomName">点击下面按钮开始抽签</div>
          <div class="random-meta" id="randomMeta">🍽 从 56 道美食中帮你挑一道</div>
          <a href="javascript:void(0)" id="randomLink" class="section-link" style="display:none;">查看这道菜的做法 →</a>
        </div>
      </div>

      <button class="random-btn" id="randomBtn">🍴 帮我选一道</button>
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      寻味小站 —— 美食智能推荐系统<br>
      2026 届毕业设计作品 · 网站2431班 · 尹阳
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    /* random 页面脚本：随机抽签选菜（带滚动动画与口味范围筛选） */

    let currentTag = null;   // null 表示全部范围
    let rolling = false;     // 是否正在抽签动画中

    // 渲染口味范围筛选按钮
    function renderRandomTags() {
      const box = document.getElementById("randomTags");
      let html = '<button class="random-tag-btn' + (currentTag === null ? " active" : "") +
        '" onclick="setRandomTag(null)">全部范围</button>';
      ALL_TAGS.forEach(function (tag) {
        html += '<button class="random-tag-btn' + (currentTag === tag ? " active" : "") +
          '" onclick="setRandomTag(\'' + tag + '\')">' + tag + "</button>";
      });
      box.innerHTML = html;
    }

    function setRandomTag(tag) {
      currentTag = tag;
      renderRandomTags();
    }

    // 当前候选菜品池
    function getPool() {
      return currentTag === null
        ? DISHES
        : DISHES.filter(function (d) { return d.tags.indexOf(currentTag) !== -1; });
    }

    // 快速滚动展示一道菜（动画用）
    function flashDish(d) {
      document.getElementById("randomImg").src = d.img;
      document.getElementById("randomName").textContent = d.name;
    }

    // 开始抽签：快速切换 1.6 秒后停在随机结果
    function rollDish() {
      if (rolling) return;
      const pool = getPool();
      if (!pool.length) { showToast("这个口味范围暂时没有菜品～"); return; }
      rolling = true;

      const card = document.getElementById("randomCard");
      const btn = document.getElementById("randomBtn");
      card.classList.add("rolling");
      btn.disabled = true;
      btn.textContent = "🎲 抽签中…";
      document.getElementById("randomLink").style.display = "none";
      document.getElementById("randomMeta").textContent = "正在从 " + pool.length + " 道美食中抽取…";

      // 每 90ms 闪换一道菜，营造老虎机效果
      const timer = setInterval(function () {
        flashDish(pool[Math.floor(Math.random() * pool.length)]);
      }, 90);

      setTimeout(function () {
        clearInterval(timer);
        const dish = pool[Math.floor(Math.random() * pool.length)];
        flashDish(dish);
        document.getElementById("randomMeta").innerHTML =
          "🎉 今天就吃它了！ ｜ " + dish.tags.join(" · ") + " ｜ ⏱ " + dish.time;
        const link = document.getElementById("randomLink");
        link.href = "detail.html?id=" + dish.id;
        link.style.display = "inline-block";
        card.classList.remove("rolling");
        btn.disabled = false;
        btn.textContent = "🔄 不满意？再抽一次";
        rolling = false;
        showToast("🎉 命运之选：" + dish.name);
      }, 1600);
    }

    document.addEventListener("DOMContentLoaded", function () {
      renderRandomTags();
      // 预展示一道随机菜品
      flashDish(DISHES[Math.floor(Math.random() * DISHES.length)]);
      document.getElementById("randomBtn").onclick = rollDish;
    });
  </script>
</body>
</html>
