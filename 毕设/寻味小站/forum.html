<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>互动社区 - 寻味小站</title>
  <meta name="description" content="寻味小站互动社区，分享美食心得，交流做菜经验。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍜</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部导航 -->
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><span class="logo-icon">🍜</span>寻味小站<small>美食智能推荐系统</small></a>
      <nav class="nav">
        <a class="nav-link" href="index.html">首页</a>
        <a class="nav-link" href="list.html">全部菜品</a>
        <a class="nav-link" href="random.html">随机选菜</a>
        <a class="nav-link" href="assistant.html">AI 助手</a>
        <a class="nav-link active" href="forum.html">互动社区</a>
        <a class="nav-link" href="user.html">个人中心</a>
      </nav>
      <div id="navUser"></div>
    </div>
  </header>

  <!-- 互动社区：发帖交流 -->
  <main class="section container">
    <div class="forum-box">
      <div class="section-head">
        <h2 class="section-title">互动社区</h2>
        <span class="section-sub">分享今天吃到的美食，聊聊口味心得</span>
      </div>

      <!-- 发帖框 -->
      <div class="forum-post-form">
        <textarea id="postContent" maxlength="200"
                  placeholder="分享一下吧：今天吃了什么好吃的？哪道菜最对你胃口？（200字以内）"></textarea>
        <div class="form-foot">
          <span class="form-tip" id="postTip">💡 游客也可以发言，登录后将以你的昵称展示</span>
          <button class="search-btn" style="padding: 8px 28px;" onclick="submitPost()">发布</button>
        </div>
      </div>

      <!-- 帖子列表 -->
      <div class="post-list" id="postList"></div>
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      寻味小站 —— 美食智能推荐系统<br>
      2026 届毕业设计作品 · 网站2431班 · 尹阳
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    /* forum 页面脚本：互动社区（发帖 / 点赞 / 浏览） */

    // 已点过赞的帖子（本机记录，防重复点赞）
    function getLikedIds() {
      return JSON.parse(localStorage.getItem("xw_liked") || "[]");
    }
    function markLiked(id) {
      const ids = getLikedIds();
      if (ids.indexOf(id) === -1) { ids.push(id); localStorage.setItem("xw_liked", JSON.stringify(ids)); }
    }

    // 渲染帖子列表
    function renderPosts() {
      const posts = getPosts();
      const box = document.getElementById("postList");
      const likedIds = getLikedIds();

      if (!posts.length) {
        box.innerHTML =
          '<div class="empty"><div class="empty-icon">💬</div>' +
          "<p>还没有人发言，来抢沙发吧～</p></div>";
        return;
      }

      box.innerHTML = posts.map(function (p) {
        const liked = likedIds.indexOf(p.id) !== -1;
        return (
          '<div class="post-item">' +
            '<div class="post-head">' +
              '<div class="post-avatar">' + escapeHtml(p.nickname.charAt(0)) + "</div>" +
              '<div class="post-meta">' +
                '<div class="post-nick">' + escapeHtml(p.nickname) + "</div>" +
                '<div class="post-time">' + p.time + "</div>" +
              "</div>" +
            "</div>" +
            '<div class="post-content">' + escapeHtml(p.content) + "</div>" +
            '<div class="post-foot">' +
              '<button class="post-like" onclick="onLike(\'' + p.id + "', this)\">" +
                '<span class="' + (liked ? "liked" : "") + '">♥</span> 点赞 <span>' + p.likes + "</span>" +
              "</button>" +
            "</div>" +
          "</div>"
        );
      }).join("");
    }

    // 发布帖子
    function submitPost() {
      const input = document.getElementById("postContent");
      const content = input.value.trim();
      if (!content) { showToast("先写点内容再发布吧～"); return; }
      addPost(content);
      input.value = "";
      const user = getCurrentUser();
      document.getElementById("postTip").textContent = user
        ? "👤 当前以「" + user.nickname + "」的身份发言"
        : "💡 游客也可以发言，登录后将以你的昵称展示";
      renderPosts();
      showToast("发布成功！");
    }

    // 点赞（同一浏览器只能点一次）
    function onLike(postId, btn) {
      if (getLikedIds().indexOf(postId) !== -1) { showToast("你已经点过赞啦～"); return; }
      likePost(postId);
      markLiked(postId);
      renderPosts();
    }

    document.addEventListener("DOMContentLoaded", function () {
      const user = getCurrentUser();
      if (user) {
        document.getElementById("postTip").textContent =
          "👤 当前以「" + user.nickname + "」的身份发言";
      }
      renderPosts();
    });
  </script>
</body>
</html>
