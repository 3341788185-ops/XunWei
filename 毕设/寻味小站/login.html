<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 / 注册 - 寻味小站</title>
  <meta name="description" content="登录或注册寻味小站账号，收藏喜欢的菜品。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍜</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部导航 -->
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><span class="logo-icon">🍜</span>寻味小站<small>美食智能推荐系统</small></a>
      <nav class="nav">
        <a class="nav-link" href="index.html">首页</a>
        <a class="nav-link" href="list.html">全部菜品</a>
        <a class="nav-link" href="random.html">随机选菜</a>
        <a class="nav-link" href="assistant.html">AI 助手</a>
        <a class="nav-link" href="forum.html">互动社区</a>
        <a class="nav-link" href="user.html">个人中心</a>
      </nav>
      <div id="navUser"></div>
    </div>
  </header>

  <!-- 登录 / 注册 -->
  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchTab('login')">登 录</button>
        <button class="auth-tab" id="tabRegister" onclick="switchTab('register')">注 册</button>
      </div>

      <!-- 登录表单 -->
      <form class="auth-form active" id="formLogin" onsubmit="return doLogin(event)">
        <div class="form-item">
          <label>账号</label>
          <input type="text" id="loginUsername" placeholder="请输入账号" maxlength="20" autocomplete="username">
        </div>
        <div class="form-item">
          <label>密码</label>
          <input type="password" id="loginPassword" placeholder="请输入密码" maxlength="20" autocomplete="current-password">
        </div>
        <button class="auth-submit" type="submit">登 录</button>
        <p class="auth-tip">登录后可保存你的收藏记录 · 游客也可直接使用推荐功能</p>
      </form>

      <!-- 注册表单 -->
      <form class="auth-form" id="formRegister" onsubmit="return doRegister(event)">
        <div class="form-item">
          <label>账号</label>
          <input type="text" id="regUsername" placeholder="设置登录账号（字母或数字）" maxlength="20">
        </div>
        <div class="form-item">
          <label>密码</label>
          <input type="password" id="regPassword" placeholder="设置密码（6-20位）" maxlength="20">
        </div>
        <div class="form-item">
          <label>昵称</label>
          <input type="text" id="regNickname" placeholder="给自己起个昵称吧" maxlength="12">
        </div>
        <button class="auth-submit" type="submit">注 册 并 登 录</button>
        <p class="auth-tip">注册即自动登录，收藏记录保存在本机浏览器</p>
      </form>
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      寻味小站 —— 美食智能推荐系统<br>
      2026 届毕业设计作品 · 网站2431班 · 尹阳
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    /* login 页面脚本：登录 / 注册逻辑（用户模块） */

    // 切换登录 / 注册选项卡
    function switchTab(name) {
      document.getElementById("tabLogin").classList.toggle("active", name === "login");
      document.getElementById("tabRegister").classList.toggle("active", name === "register");
      document.getElementById("formLogin").classList.toggle("active", name === "login");
      document.getElementById("formRegister").classList.toggle("active", name === "register");
    }

    // 登录
    function doLogin(e) {
      e.preventDefault();
      const username = document.getElementById("loginUsername").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      if (!username || !password) { showToast("请输入账号和密码"); return false; }

      const user = loginUser(username, password);
      if (!user) { showToast("账号或密码错误"); return false; }

      setCurrentUser(user);
      showToast("欢迎回来，" + user.nickname + "！");
      setTimeout(function () { location.href = "index.html"; }, 800);
      return false;
    }

    // 注册
    function doRegister(e) {
      e.preventDefault();
      const username = document.getElementById("regUsername").value.trim();
      const password = document.getElementById("regPassword").value.trim();
      const nickname = document.getElementById("regNickname").value.trim();

      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
        showToast("账号需为 3-20 位字母、数字或下划线"); return false;
      }
      if (password.length < 6) { showToast("密码至少 6 位"); return false; }
      if (!nickname) { showToast("请填写昵称"); return false; }

      const user = registerUser(username, password, nickname);
      if (!user) { showToast("该账号已被注册，换一个试试"); return false; }

      setCurrentUser(user);
      showToast("注册成功，欢迎加入寻味小站！");
      setTimeout(function () { location.href = "index.html"; }, 800);
      return false;
    }

    // 已登录用户直接跳回首页
    if (getCurrentUser()) {
      location.href = "index.html";
    }
  </script>
</body>
</html>
