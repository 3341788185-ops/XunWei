<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人中心 - 寻味小站</title>
  <meta name="description" content="寻味小站个人中心，查看账号信息与我收藏的菜品。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍜</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部导航 -->
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><span class="logo-icon">🍜</span>寻味小站<small>美食智能推荐系统</small></a>
      <nav class="nav">
        <a class="nav-link" href="index.html">首页</a>
        <a class="nav-link" href="list.html">全部菜品</a>
        <a class="nav-link" href="random.html">随机选菜</a>
        <a class="nav-link" href="assistant.html">AI 助手</a>
        <a class="nav-link" href="forum.html">互动社区</a>
        <a class="nav-link active" href="user.html">个人中心</a>
      </nav>
      <div id="navUser"></div>
    </div>
  </header>

  <!-- 个人中心：用户信息 + 收藏管理 -->
  <main class="container">
    <div class="user-panel" id="userPanel"><!-- JS 渲染用户信息 --></div>

    <section class="section" style="padding-top: 0;">
      <div class="section-head">
        <h2 class="section-title">我的收藏</h2>
        <span class="section-sub" id="favCount"></span>
      </div>
      <div class="dish-grid" id="favGrid"><!-- JS 渲染收藏菜品 --></div>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="container">
      寻味小站 —— 美食智能推荐系统<br>
      2026 届毕业设计作品 · 网站2431班 · 尹阳
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    /* user 页面脚本：个人中心（收藏管理） */

    function renderUserPanel() {
      const panel = document.getElementById("userPanel");
      const user = getCurrentUser();

      // 未登录引导
      if (!user) {
        panel.innerHTML =
          '<div class="avatar">👤</div>' +
          '<div class="user-info"><h2>你还未登录</h2>' +
          "<p>游客也可以直接使用首页的口味智能推荐哦～</p></div>" +
          '<div style="margin-left:auto;"><a class="fav-btn big" style="display:inline-block;" href="login.html">去登录 / 注册</a></div>';
        document.getElementById("favCount").textContent = "";
        document.getElementById("favGrid").innerHTML =
          '<div class="empty" style="grid-column: 1 / -1;">' +
            '<div class="empty-icon">🔐</div>' +
            "<p>登录后即可保存和管理你的收藏记录～</p>" +
          "</div>";
        return;
      }

      panel.innerHTML =
        '<div class="avatar">' + escapeHtml(user.nickname.charAt(0)) + "</div>" +
        '<div class="user-info">' +
          "<h2>" + escapeHtml(user.nickname) + "</h2>" +
          "<p>账号：" + escapeHtml(user.username) + " ｜ 当前收藏 <b id='favNum'>0</b> 道菜品" +
        "</p></div>" +
        '<div style="margin-left:auto;"><button class="fav-btn big" onclick="logout()">退出登录</button></div>';

      renderFavList();
    }

    // 渲染收藏列表
    function renderFavList() {
      const user = getCurrentUser();
      if (!user) return;

      const favIds = getFavorites();
      const grid = document.getElementById("favGrid");
      const count = document.getElementById("favCount");
      const num = document.getElementById("favNum");

      if (num) num.textContent = favIds.length;
      count.textContent = "共收藏 " + favIds.length + " 道菜品";

      if (!favIds.length) {
        grid.innerHTML =
          '<div class="empty" style="grid-column: 1 / -1;">' +
            '<div class="empty-icon">🍽️</div>' +
            "<p>还没有收藏菜品，去逛逛吧～</p>" +
            '<a class="section-link" href="index.html">去首页看看推荐</a>' +
          "</div>";
        return;
      }

      grid.innerHTML = favIds
        .map(function (id) { return DISHES.find(function (d) { return d.id === id; }); })
        .filter(Boolean)
        .map(function (d) { return renderDishCard(d, { fav: true }); })
        .join("");
    }

    document.addEventListener("DOMContentLoaded", renderUserPanel);
  </script>
</body>
</html>
